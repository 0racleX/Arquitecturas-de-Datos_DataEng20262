version: 2

# raw_data guarda cada lote extraído (columna _batch_id); RAW es palabra reservada en Redshift.
sources:
  - name: mysql_raw
    schema: raw_data
    tables:
      - name: mysql_customers
      - name: mysql_products
      - name: mysql_orders
      - name: mysql_order_items
  - name: mongodb_raw
    schema: raw_data
    tables:
      - name: mongo_reviews
      - name: mongo_navigation_events
  - name: ops
    schema: ops
    tables:
      - name: batch_control
      - name: extraction_log
